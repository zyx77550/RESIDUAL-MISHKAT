<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diftar - Bibliothèque Interactive</title>
    <style>
        :root {
            --c-tajweed: #8B2635;
            --c-revision: #E63946;
            --c-tafsir: #2D6A4F;
            --c-vocab: #D4AF37;
            --c-planning: #7209B7;
            --c-objectifs: #4361EE;
            --c-doua: #03045E;
            --c-notes: #4A4E69;
            --c-schema: #FB8500;
            --c-libre: #B5838D;
            --bg-page: #fdfcf8;
            --font-serif: "Playfair Display", Georgia, serif;
            --font-sans: system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: var(--font-sans); 
            padding: 40px 20px;
            background-color: var(--bg-page);
            color: #2c2c2c;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        .section-header { text-align: center; margin-bottom: 50px; }
        .section-header h1 { font-family: var(--font-serif); font-style: italic; font-size: 32px; color: var(--c-tajweed); }

        .v1-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); 
            gap: 40px 30px; 
        }

        .card-wrapper { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            transition: all 0.4s ease; 
        }
        
        .top-label {
            display: flex; align-items: center; gap: 6px;
            font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em;
            margin-bottom: 12px; border: 1px solid rgba(0,0,0,0.05); padding: 3px 12px; border-radius: 20px;
            background: white; color: #888;
        }
        .top-label .dot { width: 7px; height: 7px; border-radius: 50%; }

        /* Carte Carnet */
        .v1-card {
            position: relative; border-radius: 4px 16px 16px 4px; overflow: hidden;
            border: 1px solid rgba(0,0,0,0.06); background: white;
            aspect-ratio: 3 / 4.2; width: 100%;
            display: flex; flex-direction: column;
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
            transition: transform 0.3s cubic-bezier(0.2, 1, 0.3, 1);
            cursor: pointer;
        }
        .v1-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.07); }

        .v1-spine { width: 18px; position: absolute; left: 0; top: 0; bottom: 0; z-index: 10; box-shadow: inset -2px 0 5px rgba(0,0,0,0.1); }
        .v1-holes { position: absolute; left: 7px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: space-around; padding: 35px 0; z-index: 11; }
        .v1-hole { width: 4px; height: 4px; border-radius: 50%; background: var(--bg-page); box-shadow: inset 0 1px 2px rgba(0,0,0,0.2); }

        .v1-body { 
            margin-left: 18px; flex: 1; position: relative; 
            display: flex; flex-direction: column; overflow: hidden;
        }
        
        .image-container { flex: 1; overflow: hidden; background: #fafafa; }
        .notebook-image { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* Pied de page avec Input intégré */
        .v1-footer { 
            padding: 14px 12px; background: white; border-top: 1px solid #f8f8f8;
            display: flex; justify-content: space-between; align-items: center;
        }
        .footer-content { flex: 1; display: flex; flex-direction: column; margin-right: 8px; }

        /* Input de nom invisible jusqu'au focus */
        .input-name-internal {
            width: 100%;
            border: none;
            background: transparent;
            font-family: var(--font-serif);
            font-size: 15px;
            font-weight: 600;
            font-style: italic;
            color: inherit;
            outline: none;
            padding: 0;
            margin: 0;
            cursor: text;
        }
        .input-name-internal:focus { border-bottom: 1px solid rgba(0,0,0,0.1); }

        .footer-sub { font-size: 10px; color: #aaa; margin-top: 1px; }
        .footer-icon { font-size: 16px; opacity: 0.4; }

        /* BOUTONS DISCRETS EN DESSOUS */
        .controls-area {
            margin-top: 16px;
            display: flex;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }

        .action-btn {
            background: transparent;
            border: none;
            padding: 4px 8px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #999;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            border-radius: 4px;
        }

        .action-btn:hover { color: #555; background: rgba(0,0,0,0.03); }
        
        .btn-enter { color: var(--c-tafsir); font-weight: 800; border: 1px solid rgba(45, 106, 79, 0.1); padding: 5px 12px; border-radius: 20px; }
        .btn-enter:hover { background: rgba(45, 106, 79, 0.05); color: #1a4d38; border-color: rgba(45, 106, 79, 0.2); }
        
        .btn-delete:hover { color: #8B2635; background: rgba(139, 38, 53, 0.05); }

        .removing { opacity: 0; transform: scale(0.95); pointer-events: none; }
    </style>
</head>
<body>

<div class="container">
    <header class="section-header">
        <h1>Ma Bibliothèque Diftar</h1>
    </header>

    <div id="notebook-grid" class="v1-grid">
        <!-- JS Rendu -->
    </div>
</div>

<script>
    const basePath = './images/'; 

    const notebookTemplates = {
        'tajweed':   { label: 'Tajweed',    color: '--c-tajweed',   icon: '📖', img: 'tajweed.png' },
        'revision':  { label: 'Révision',   color: '--c-revision',  icon: '🔄', img: 'revision.png' },
        'tafsir':    { label: 'Tafsir',     color: '--c-tafsir',    icon: '🔍', img: 'tafsir.png' },
        'vocab':     { label: 'Vocabulaire', color: '--c-vocab',     icon: '📝', img: 'vocab.png' },
        'planning':  { label: 'Planning',   color: '--c-planning',  icon: '📅', img: 'planning.png' },
        'objectifs': { label: 'Objectifs',  color: '--c-objectifs', icon: '🎯', img: 'objectifs.png' },
        'doua':      { label: 'Dou\'a',      color: '--c-doua',      icon: '🤲', img: 'doua.png' },
        'notes':     { label: 'Notes',      color: '--c-notes',     icon: '📓', img: 'notes.png' },
        'schema':    { label: 'Schéma',     color: '--c-schema',    icon: '📐', img: 'schema.png' },
        'libre':     { label: 'Libre',      color: '--c-libre',     icon: '✨', img: 'libre.png' }
    };

    let myLibrary = [
        { id: '1', type: 'tajweed',   customName: 'Tajweed' },
        { id: '2', type: 'revision',  customName: 'Révision Coran' },
        { id: '3', type: 'tafsir',    customName: 'Tafsir' },
        { id: '4', type: 'vocab',     customName: 'Vocabulaire' },
        { id: '5', type: 'planning',  customName: 'Planning' }
    ];

    function renderLibrary() {
        const grid = document.getElementById('notebook-grid');
        grid.innerHTML = '';

        myLibrary.forEach(item => {
            const template = notebookTemplates[item.type];
            const wrapper = document.createElement('div');
            wrapper.className = 'card-wrapper';
            wrapper.id = `wrapper-${item.id}`;
            
            wrapper.innerHTML = `
                <div class="top-label">
                    <div class="dot" style="background:var(${template.color})"></div> 
                    ${template.label}
                </div>
                
                <div class="v1-card">
                    <div class="v1-spine" style="background:var(${template.color})"></div>
                    <div class="v1-holes">
                        <div class="v1-hole"></div><div class="v1-hole"></div><div class="v1-hole"></div><div class="v1-hole"></div><div class="v1-hole"></div>
                    </div>
                    <div class="v1-body" onclick="openNotebook('${item.id}')">
                        <div class="image-container">
                            <img class="notebook-image" src="${basePath}${template.img}" alt="${item.customName}" onerror="this.src='https://via.placeholder.com/300x400?text=Illustration'">
                        </div>
                        <div class="v1-footer">
                            <div class="footer-content">
                                <input class="input-name-internal" 
                                       style="color:var(${template.color})"
                                       value="${item.customName}" 
                                       onclick="event.stopPropagation()"
                                       oninput="updateName('${item.id}', this.value)">
                                <div class="footer-sub">Carnet Artisanal</div>
                            </div>
                            <span class="footer-icon">${template.icon}</span>
                        </div>
                    </div>
                </div>

                <div class="controls-area">
                    <button class="action-btn btn-enter" onclick="openNotebook('${item.id}')">Entrer</button>
                    <button class="action-btn" onclick="focusInput('${item.id}')">Renommer</button>
                    <button class="action-btn btn-delete" onclick="deleteNotebook('${item.id}')">Supprimer</button>
                </div>
            `;
            grid.appendChild(wrapper);
        });
    }

    function updateName(id, newName) {
        const item = myLibrary.find(i => i.id === id);
        if (item) item.customName = newName;
    }

    function openNotebook(id) {
        const item = myLibrary.find(i => i.id === id);
        console.log(`Navigation vers : ${item.customName}`);
    }

    function focusInput(id) {
        const input = document.querySelector(`#wrapper-${id} .input-name-internal`);
        input.focus();
        input.select();
    }

    function deleteNotebook(id) {
        const wrapper = document.getElementById(`wrapper-${id}`);
        wrapper.classList.add('removing');
        setTimeout(() => {
            myLibrary = myLibrary.filter(i => i.id !== id);
            renderLibrary();
        }, 400);
    }

    window.onload = renderLibrary;
</script>

</body>
</html>
