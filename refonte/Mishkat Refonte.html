<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mishkat — Refonte complète</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Inter:wght@400;500;600&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #06050a; }
  * { box-sizing: border-box; }
  .artboard-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
  .artboard-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 6px; }
  .artboard-scroll::-webkit-scrollbar-track { background: transparent; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tokens.jsx"></script>
<script type="text/babel" src="sample-data.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="screen-dashboard.jsx"></script>
<script type="text/babel" src="screen-memo-cal.jsx"></script>
<script type="text/babel" src="screen-goals-badges-tasbih.jsx"></script>
<script type="text/babel" src="screen-coloring-diftar-kanban.jsx"></script>
<script type="text/babel" src="screen-baqara-settings-admin-auth.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "gold"
}/*EDITMODE-END*/;

const App = () => {
  const [theme, setTheme] = React.useState(TWEAK_DEFAULTS.theme);

  // tweaks panel
  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setPanelOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setPanelOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({type: '__edit_mode_available'}, '*');
    return () => window.removeEventListener('message', handler);
  }, []);
  const [panelOpen, setPanelOpen] = React.useState(false);
  const setTweak = (k, v) => {
    setTheme(v);
    window.parent.postMessage({type: '__edit_mode_set_keys', edits: {[k]: v}}, '*');
  };

  const t = THEMES[theme];

  return (
    <ThemeContext.Provider value={t}>
      <DesignCanvas>
        <DCSection id="brand" title="Identité de marque · Mishkat">
          <DCArtboard id="wordmark" label="Wordmark · Lanterne" width={760} height={300}>
            <div style={{ width: 760, height: 300, background: t.bg, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 50, fontFamily: 'Inter' }}>
              <LanternMark size={140} color={t.accent}/>
              <div>
                <div style={{ fontFamily: 'Fraunces', fontWeight: 300, fontSize: 64, color: t.ink, letterSpacing: '-0.03em', lineHeight: 1 }}>Mishkat</div>
                <div style={{ fontFamily: 'Amiri Quran, serif', fontSize: 28, color: t.accentBright, marginTop: 10 }}>مِشْكَاة</div>
                <div style={{ fontSize: 11, color: t.inkMute, letterSpacing: '0.32em', textTransform: 'uppercase', marginTop: 14 }}>Hifẓ al-Qur'ān</div>
              </div>
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection id="auth" title="Auth · Connexion">
          <DCArtboard id="auth-login" label="Connexion" width={1280} height={820}><AuthScreen/></DCArtboard>
        </DCSection>

        <DCSection id="core" title="Sections principales · 13 écrans dans la même direction">
          <DCArtboard id="dash" label="Dashboard" width={1280} height={820}><DashboardScreen/></DCArtboard>
          <DCArtboard id="memo" label="Mémorisation" width={1280} height={820}><MemorizationScreen/></DCArtboard>
          <DCArtboard id="cal" label="Calendrier" width={1280} height={820}><CalendarScreen/></DCArtboard>
          <DCArtboard id="goals" label="Objectifs" width={1280} height={820}><GoalsScreen/></DCArtboard>
          <DCArtboard id="badges" label="Badges" width={1280} height={820}><BadgesScreen/></DCArtboard>
          <DCArtboard id="tasbih" label="Tasbih" width={1280} height={820}><TasbihScreen/></DCArtboard>
          <DCArtboard id="coloring" label="Coloriage" width={1280} height={820}><ColoringScreen/></DCArtboard>
          <DCArtboard id="diftar" label="Diftar" width={1280} height={820}><DiftarScreen/></DCArtboard>
          <DCArtboard id="kanban" label="Suivi (Kanban)" width={1280} height={820}><KanbanScreen/></DCArtboard>
          <DCArtboard id="albaqara" label="Al-Baqarah (lecteur)" width={1280} height={820}><AlBaqaraScreen/></DCArtboard>
          <DCArtboard id="settings" label="Réglages" width={1280} height={820}><SettingsScreen/></DCArtboard>
          <DCArtboard id="admin" label="Admin" width={1280} height={820}><AdminScreen/></DCArtboard>
        </DCSection>
      </DesignCanvas>

      {panelOpen && (
        <div style={{ position: 'fixed', bottom: 24, right: 24, background: '#1a1612', border: '1px solid #2a241c', borderRadius: 14, padding: 18, width: 280, zIndex: 9999, fontFamily: 'Inter', boxShadow: '0 20px 60px rgba(0,0,0,0.6)' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
            <div style={{ fontFamily: 'Fraunces', fontSize: 16, color: '#f5e9d0', fontWeight: 300 }}>Tweaks</div>
            <span onClick={() => { setPanelOpen(false); window.parent.postMessage({type: '__edit_mode_dismissed'}, '*'); }} style={{ color: '#a89880', cursor: 'pointer', fontSize: 18 }}>×</span>
          </div>
          <div style={{ fontSize: 10, color: '#5d5240', letterSpacing: '0.18em', textTransform: 'uppercase', marginBottom: 8 }}>Thème global</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {Object.entries(THEMES).map(([k, th]) => (
              <div key={k} onClick={() => setTweak('theme', k)} style={{ padding: '10px 12px', background: theme === k ? `${th.accent}18` : '#211c16', border: `1px solid ${theme === k ? th.accent : '#2a241c'}`, borderRadius: 8, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 10 }}>
                <div style={{ display: 'flex', gap: 3 }}>
                  <div style={{ width: 14, height: 14, borderRadius: 3, background: th.accent }}/>
                  <div style={{ width: 14, height: 14, borderRadius: 3, background: th.accentBright }}/>
                  <div style={{ width: 14, height: 14, borderRadius: 3, background: th.bg, border: `1px solid ${th.line}` }}/>
                </div>
                <div style={{ fontSize: 12, color: '#f5e9d0', fontWeight: theme === k ? 500 : 400 }}>{th.name}</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </ThemeContext.Provider>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
